name: Guardian integrity sweep

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "work/**"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Read-only by design. This workflow must not push, merge, delete, or rewrite.
permissions:
  contents: read

concurrency:
  group: guardian-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardian-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch formatting
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            previous="$(git rev-list --max-count=2 HEAD | tail -n 1)"
            if [[ -n "$previous" ]]; then
              git diff --check "$previous" HEAD
            fi
          fi

      - name: Scan tracked files for high-confidence credential patterns
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import sys

          patterns = [
              ("private-key PEM block", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----")),
              ("GitHub token prefix", re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{30,}\b")),
              ("GitHub fine-grained token prefix", re.compile(r"\bgithub_pat_[A-Za-z0-9_]{30,}\b")),
              ("AWS access key ID", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("Google API key prefix", re.compile(r"\bAIza[0-9A-Za-z_-]{35}\b")),
          ]
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=False
          ).split(b"\0")
          findings = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode("utf-8", "replace"))
              try:
                  data = path.read_bytes()
                  if b"\0" in data or len(data) > 2_000_000:
                      continue
                  content = data.decode("utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              for line_number, line in enumerate(content.splitlines(), 1):
                  for label, pattern in patterns:
                      if pattern.search(line):
                          findings.append({
                              "path": path.as_posix(),
                              "line": line_number,
                              "kind": label,
                          })
          report = {
              "repository": "${{ github.repository }}",
              "commit": "${{ github.sha }}",
              "event": "${{ github.event_name }}",
              "actor": "${{ github.actor }}",
              "findings": findings,
              "finding_count": len(findings),
          }
          pathlib.Path("guardian-report.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          for finding in findings:
              print(
                  f"::error file={finding['path']},line={finding['line']}::"
                  f"Possible {finding['kind']} detected; secret value suppressed."
              )
          print(json.dumps({k: v for k, v in report.items() if k != "findings"}, indent=2))
          if findings:
              sys.exit(1)
          PY

      - name: Flag sensitive-path changes for human review
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          else
            changed="$(git log --format= --name-only -n 30 HEAD | sort -u)"
          fi
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              .github/workflows/*|package.json|package-lock.json|server.ts|src/lib/approval-gate.ts|*release*|*permission*|*auth*)
                echo "::warning file=$path::Sensitive-path change detected. Require independent human review; this warning is not an approval."
                ;;
            esac
          done <<< "$changed"

      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-report-${{ github.run_id }}
          path: guardian-report.json
          if-no-files-found: ignore
          retention-days: 30
